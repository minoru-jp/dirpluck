[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dirpluck"
dynamic = ["version"]
description = "Select files from declared runtime and fixed sources and package them into ZIP archives."
readme = "README.md"
authors = [{ name = "minoru_jp" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

keywords = ["llm", "developer-tools", "file-selection", "directory", "cli", "toml", "zip"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["shikumi-devdoc>=0.3.2"]

[project.urls]
Homepage = "https://github.com/minoru-jp/dirpluck"
Documentation = "https://github.com/minoru-jp/dirpluck#documentation"
Repository = "https://github.com/minoru-jp/dirpluck"
Issues = "https://github.com/minoru-jp/dirpluck/issues"
Changelog = "https://github.com/minoru-jp/dirpluck/blob/main/CHANGELOG.md"

[project.scripts]
dirpluck = "dirpluck.cli:main"

[dependency-groups]
docs = ["shikumi-devdoc>=0.3.2"]
quality = [
    "ruff==0.16.10",
    "basedpyright==1.40.1",
]

[tool.hatch.version]
path = "src/dirpluck/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dirpluck"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "dirpluck/_docs/README.md"
"GLOSSARY.md" = "dirpluck/_docs/GLOSSARY.md"
"CHANGELOG.md" = "dirpluck/_docs/CHANGELOG.md"
"STATUS.md" = "dirpluck/_docs/STATUS.md"
"docs" = "dirpluck/_docs/docs"

[tool.hatch.build.targets.sdist]
# The sdist is the complete release source. Hatchling includes the project by
# default while respecting VCS ignore rules; exclude only repository-operation
# files that are not part of the release itself.
exclude = [
    "/.github",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E301", "E302", "E303", "E304", "E305", "E306", "E4", "E7", "E9", "F"]
preview = true
explicit-preview-rules = true

[tool.basedpyright]
pythonVersion = "3.11"
extraPaths = ["src"]
executionEnvironments = [
    { root = "devdocs", extraPaths = [".", "src"], reportUnannotatedClassAttribute = "none", reportAny = "none" },
    { root = "tests", extraPaths = [".", "src"], reportUnusedCallResult = "none", reportPrivateUsage = "none" },
    { root = "src", extraPaths = [".", "src"], reportPrivateUsage = "none", reportUnnecessaryIsInstance = "none" },
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
