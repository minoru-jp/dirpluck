name: Reusable checks

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Optional Git ref to check out before running the checks
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  quality:
    name: Ruff and basedpyright
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group quality
          python -m pip install --group docs

      - name: Check Ruff formatting
        run: ruff format --check src tests tools

      - name: Run Ruff lint
        run: ruff check .

      - name: Run basedpyright
        run: basedpyright --pythonpath "$(command -v python)"

  canonical-docs:
    name: Check canonical documents
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group docs

      - name: Check canonical documents
        run: python tools/render_canonical_docs.py --check

      - name: Check published documents
        run: python tools/check_published_docs.py

  test:
    name: Test on Ubuntu (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Check legacy unittest discovery compatibility
        if: matrix.python-version == '3.13'
        run: python -m unittest discover -s tests -v

  windows-test:
    name: Test on Windows (Python 3.13)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
