name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test release tag
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify release tag matches project version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import sys

          sys.path.insert(0, "src")
          from dirpluck import __version__

          expected = f"v{__version__}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match project version; expected {expected!r}")
          print(f"release tag {actual} matches project version")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Check canonical documents
        run: python tools/render_canonical_docs.py --check

      - name: Run tests
        run: python -m unittest discover -s tests -v

  build:
    name: Build release distributions
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build wheel and sdist
        run: |
          rm -rf dist
          python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Check distribution contents
        run: python tools/verify_distribution_contents.py

      - name: Smoke-test built wheel
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --no-deps dist/*.whl
          .release-smoke/bin/python -m pip check
          .release-smoke/bin/dirpluck --version
          .release-smoke/bin/python -c "import dirpluck; print(dirpluck.__version__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dirpluck
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
